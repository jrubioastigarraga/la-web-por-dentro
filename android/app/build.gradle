plugins {
    id 'com.android.application'
}

android {
    namespace 'eus.lhusurbil.escuadronweb'
    compileSdk 34

    defaultConfig {
        applicationId "eus.lhusurbil.escuadronweb"
        minSdk 29
        targetSdk 34
        versionCode 2
        versionName "1.1"
    }

    buildTypes {
        release {
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
