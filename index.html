<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>La Web por Dentro · VR para DAW</title>
    <meta
      name="description"
      content="Juego educativo en 3D y realidad virtual para el ciclo de Desarrollo de Aplicaciones Web: HTTP, CSS, Git, bases de datos y accesibilidad."
    />
    <meta name="theme-color" content="#070b14" />
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%23070b14'/%3E%3Ccircle cx='32' cy='32' r='17' fill='none' stroke='%234de2c5' stroke-width='4'/%3E%3Ccircle cx='32' cy='32' r='5' fill='%234de2c5'/%3E%3C/svg%3E"
    />
    <link rel="stylesheet" href="./src/styles.css" />
  </head>
  <body>
    <div id="app"></div>

    <header id="topbar">
      <div class="brand">
        <span class="logo" aria-hidden="true"></span>
        <span>La Web por Dentro<small>DAW · WebXR</small></span>
      </div>
      <div class="dots" id="dots" aria-label="Progreso del juego"></div>
    </header>

    <div id="controls">
      <button class="ui" id="btn-back" hidden>← Volver al hub</button>
      <button class="ui" id="btn-reset">Reiniciar progreso</button>
    </div>

    <div id="hint">
      Arrastra para mirar · haz clic para interactuar<br />
      En VR: apunta con el mando y dispara el gatillo
    </div>

    <div id="loader">
      <div class="spinner" aria-hidden="true"></div>
      <p>Cargando el sistema…</p>
    </div>

    <script type="module" src="./src/main.js"></script>
  </body>
</html>
